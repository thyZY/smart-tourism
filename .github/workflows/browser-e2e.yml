name: Smart Tourism Browser E2E
on:
  pull_request:
  workflow_dispatch:

jobs:
  chromium-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend and isolated browser test runner
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start isolated real FastAPI backend
        run: |
          PYTHONPATH=backend nohup python -m uvicorn e2e_mock_server:app --host 127.0.0.1 --port 8010 > /tmp/smart-tourism-backend.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8010/api/health && break || sleep 1; done
      - name: Run real Chromium interactions (mock HTTP boundary only, no API keys)
        working-directory: frontend
        run: npx playwright test
      - name: Backend fixture log on failure
        if: failure()
        run: cat /tmp/smart-tourism-backend.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
