name: Smart Tourism Browser E2E
on:
  push:
    branches:
      - 'feat/pwa-*'
  pull_request:
  workflow_dispatch:

jobs:
  chromium-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install isolated FastAPI fixture dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install frontend and browser test runner
        id: frontend-deps
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        id: chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start isolated real FastAPI backend
        run: |
          set -e
          PYTHONPATH=backend nohup python -m uvicorn e2e_mock_server:app --host 127.0.0.1 --port 8010 > /tmp/smart-tourism-backend.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8010/api/health; then exit 0; fi
            sleep 1
          done
          cat /tmp/smart-tourism-backend.log
          exit 1
      - name: Run regular Chromium browser regression
        working-directory: frontend
        run: npm run test:e2e
      - name: Run production PWA lifecycle regression
        if: ${{ always() && steps.frontend-deps.outcome == 'success' && steps.chromium.outcome == 'success' }}
        working-directory: frontend
        run: npm run test:pwa
      - name: Backend fixture log on failure
        if: failure()
        run: cat /tmp/smart-tourism-backend.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
