name: Smart Tourism CI

on:
  push:
    branches:
      - feat/itinerary-management-20261014
      - 'feat/v1.*'
  pull_request:

jobs:
  code-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Offline grounded itinerary tests (no DB, no DeepSeek Key)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Existing frontend state and map workflow regression
        run: node tests/frontend-workflow.mjs
      - name: AI plan, restore and export UI state tests
        run: node tests/ai-itinerary-ui.mjs
      - name: Workspace layout and previous feature availability
        run: node tests/ui-layout.mjs
      - name: Build Vue frontend
        run: |
          cd frontend
          npm ci
          npm run build
