name: Smart Tourism checks

on:
  push:
    branches:
      - feat/poi-tourism-metadata-20261008
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi pydantic psycopg2-binary python-dotenv
      - name: Run offline Python unit tests
        env:
          DEEPSEEK_API_KEY: ''
        run: python -m unittest discover -s tests -p "test_*.py"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check mocked frontend workflow
        run: node tests/frontend-workflow.mjs
      - name: Exercise editable AI itinerary UI
        run: node tests/ai-edit-workflow.mjs
      - name: Exercise confirmed multi-turn AI chat
        run: node tests/ai-chat-workflow.mjs
      - name: Check responsive map layout contract
        run: node tests/ui-layout.mjs
      - name: Build frontend
        working-directory: frontend
        run: npm run build
